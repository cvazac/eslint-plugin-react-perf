name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        eslint: [9, 10]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check ESLint 9 compatibility
        if: matrix.eslint == 9
        run: npm install --no-save --package-lock=false eslint@9 @eslint/js@9
      - run: npm test
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm pack --dry-run
